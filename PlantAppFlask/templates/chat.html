<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlantCare AI - Chat</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .container {
            display: flex;
            flex-direction: column;
            height: 100%;
            padding-bottom: 0;
        }
    </style>
</head>
<body>
    <!-- Sidebar Overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">
                <i class="material-icons">eco</i>
            </div>
            <h2 style="font-size: 20px;">PlantCare AI</h2>
        </div>
        <div class="sidebar-menu">
            <a href="/home" class="menu-item">
                <i class="material-icons">home</i>
                <span data-i18n="nav.home">Home</span>
            </a>
            <a href="/diagnosis" class="menu-item">
                <i class="material-icons">camera_alt</i>
                <span data-i18n="nav.diagnosis">AI Diagnosis</span>
            </a>
            <a href="/chat" class="menu-item active">
                <i class="material-icons">chat</i>
                <span data-i18n="nav.chat">Plant Doctor</span>
            </a>
            <a href="/history" class="menu-item">
                <i class="material-icons">history</i>
                <span data-i18n="nav.history">History</span>
            </a>
            <a href="/about" class="menu-item">
                <i class="material-icons">info</i>
                <span data-i18n="nav.about">About App</span>
            </a>
            <a href="/language" class="menu-item">
                <i class="material-icons">translate</i>
                <span data-i18n="nav.language">Language</span>
            </a>
            <div style="border-top: 1px solid var(--gray-100); margin: 10px 0;"></div>
            <a href="#" onclick="handleLogout()" class="menu-item">
                <i class="material-icons">logout</i>
                <span data-i18n="nav.logout">Logout</span>
            </a>
        </div>
    </div>

    <div class="container">
        <!-- Sidebar Toggle Button -->
        <button class="sidebar-btn" onclick="toggleSidebar()">
            <i class="material-icons">menu</i>
        </button>
        <!-- Header -->
        <div class="header">
            <div style="width:40px;"></div>
            <h1 class="header-title" data-i18n="chat.title">Plant Doctor</h1>
            <div style="width:40px;"></div>
        </div>

        <!-- Chat Container -->
        <div class="chat-container animate-fade-in">
            <div class="chat-messages" id="chatMessages">
                <!-- Bot Message -->
                <div class="message bot">
                    <div class="bot-icon">
                        <i class="material-icons">eco</i>
                    </div>
                    <div class="message-bubble" id="greetingMsg" data-i18n="chat.greeting">
                        Hello! I am your Plant Doctor AI. How can I help you with your plants today?
                    </div>
                </div>
            </div>

            <!-- Input Area -->
            <div class="chat-input">
                <input type="text" id="messageInput" data-i18n-placeholder="chat.placeholder" placeholder="Type your question..." onkeypress="handleKeyPress(event)">
                <button class="send-btn" onclick="sendMessage()">
                    <i class="material-icons">send</i>
                </button>
            </div>
        </div>
    </div>

    <script>
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message) return;

            // Add user message
            addMessage(message, 'user');
            input.value = '';

            // Show thinking indicator
            const thinkingText = window.t ? window.t('chat.thinking') : 'Thinking...';
            const thinkingId = 'thinking-' + Date.now();
            addMessage(thinkingText, 'bot', thinkingId);

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message, lang: window.getLang ? window.getLang() : 'en' })
                });
                const data = await response.json();

                // Remove thinking bubble
                const thinkingEl = document.getElementById(thinkingId);
                if (thinkingEl) thinkingEl.remove();

                if (data.success) {
                    addMessage(data.response, 'bot');
                } else {
                    addMessage('Sorry, I could not process your request. Please try again.', 'bot');
                }
            } catch (error) {
                const thinkingEl = document.getElementById(thinkingId);
                if (thinkingEl) thinkingEl.remove();
                addMessage('Network error. Please check your connection and try again.', 'bot');
            }
        }

        function addMessage(text, type, id) {
            const messagesContainer = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            if (id) messageDiv.id = id;

            // Sanitize text to prevent XSS
            const safeText = document.createElement('span');
            safeText.textContent = text;

            if (type === 'bot') {
                const botIcon = document.createElement('div');
                botIcon.className = 'bot-icon';
                botIcon.innerHTML = '<i class="material-icons">eco</i>';
                const bubble = document.createElement('div');
                bubble.className = 'message-bubble';
                bubble.textContent = text;
                messageDiv.appendChild(botIcon);
                messageDiv.appendChild(bubble);
            } else {
                const bubble = document.createElement('div');
                bubble.className = 'message-bubble';
                bubble.textContent = text;
                messageDiv.appendChild(bubble);
            }

            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('sidebarOverlay').classList.toggle('active');
        }

        async function handleLogout() {
            try {
                await fetch('/api/logout', { method: 'POST' });
                window.location.href = '/login';
            } catch (error) {
                console.error('Logout error:', error);
                window.location.href = '/login';
            }
        }
    </script>
    <script src="{{ url_for('static', filename='js/i18n.js') }}"></script>
</body>
</html>
