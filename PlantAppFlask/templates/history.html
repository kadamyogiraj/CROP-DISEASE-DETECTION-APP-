<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlantCare AI - History</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .container {
            display: flex;
            flex-direction: column;
            flex: 1;
            padding-bottom: 0;
        }
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: var(--text-gray);
        }
        .empty-state i {
            font-size: 60px;
            color: var(--gray-100);
            display: block;
            margin-bottom: 16px;
        }
        .empty-state p {
            font-size: 16px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <!-- Sidebar Overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">
                <i class="material-icons">eco</i>
            </div>
            <h2 style="font-size: 20px;">PlantCare AI</h2>
        </div>
        <div class="sidebar-menu">
            <a href="/home" class="menu-item">
                <i class="material-icons">home</i>
                <span data-i18n="nav.home">Home</span>
            </a>
            <a href="/diagnosis" class="menu-item">
                <i class="material-icons">camera_alt</i>
                <span data-i18n="nav.diagnosis">AI Diagnosis</span>
            </a>
            <a href="/chat" class="menu-item">
                <i class="material-icons">chat</i>
                <span data-i18n="nav.chat">Plant Doctor</span>
            </a>
            <a href="/history" class="menu-item active">
                <i class="material-icons">history</i>
                <span data-i18n="nav.history">History</span>
            </a>
            <a href="/about" class="menu-item">
                <i class="material-icons">info</i>
                <span data-i18n="nav.about">About App</span>
            </a>
            <a href="/language" class="menu-item">
                <i class="material-icons">translate</i>
                <span data-i18n="nav.language">Language</span>
            </a>
            <div style="border-top: 1px solid var(--gray-100); margin: 10px 0;"></div>
            <a href="#" onclick="handleLogout()" class="menu-item">
                <i class="material-icons">logout</i>
                <span data-i18n="nav.logout">Logout</span>
            </a>
        </div>
    </div>

    <div class="container">
        <!-- Sidebar Toggle Button -->
        <button class="sidebar-btn" onclick="toggleSidebar()">
            <i class="material-icons">menu</i>
        </button>
        <!-- Header -->
        <div class="header">
            <div style="width:40px;"></div>
            <h1 class="header-title" data-i18n="history.title">History</h1>
            <div style="width:40px;"></div>
        </div>

        <!-- History Container (loaded from API) -->
        <div class="history-container animate-fade-in" id="historyContainer">
            <!-- Loading state -->
            <div class="empty-state" id="loadingState">
                <i class="material-icons" style="color: var(--dark-green);">hourglass_empty</i>
                <p>Loading...</p>
            </div>
        </div>
    </div>

    <script>
        async function loadHistory() {
            const container = document.getElementById('historyContainer');
            try {
                const response = await fetch('/api/history');
                const data = await response.json();

                container.innerHTML = '';

                if (!data.success || !data.history || data.history.length === 0) {
                    const noHistoryText = window.t ? window.t('history.no_history') : 'No diagnosis history found.';
                    const scanNowText = window.t ? window.t('history.scan_now') : 'Scan a Plant Now';
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="material-icons">history</i>
                            <p>${noHistoryText}</p>
                            <a href="/diagnosis" class="btn btn-primary" style="display:inline-flex; padding: 12px 28px;">${scanNowText}</a>
                        </div>
                    `;
                    return;
                }

                data.history.forEach(function(item) {
                    const isHealthy = item.disease === 'Healthy';
                    const isUnknown = item.is_unknown === 1;
                    const iconName = isHealthy ? 'check_circle' : (isUnknown ? 'help_outline' : 'warning');
                    const iconColor = isHealthy ? 'green' : (isUnknown ? '#9E9E9E' : '');

                    const date = new Date(item.created_at);
                    const dateStr = date.toLocaleDateString();
                    const timeStr = date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

                    const card = document.createElement('div');
                    card.className = 'history-card';
                    card.innerHTML = `
                        <div class="history-header">
                            <div class="history-icon">
                                <i class="material-icons">local_florist</i>
                            </div>
                            <div class="history-info">
                                <h3 class="history-plant">${escapeHtml(item.plant_name || 'Unknown')}</h3>
                                <div class="history-disease">
                                    <i class="material-icons ${iconColor}" style="${isUnknown ? 'color:#9E9E9E' : ''}">${iconName}</i>
                                    <span>${escapeHtml(item.disease || 'Unknown')}</span>
                                </div>
                            </div>
                            <span class="confidence-badge">${escapeHtml(item.confidence || 'N/A')}</span>
                        </div>
                        <div class="history-footer">
                            <div class="history-date">
                                <i class="material-icons">calendar_today</i>
                                <span>${dateStr}</span>
                            </div>
                            <div class="history-date">
                                <i class="material-icons">access_time</i>
                                <span>${timeStr}</span>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                });

            } catch (error) {
                console.error('History load error:', error);
                const noHistoryText = window.t ? window.t('history.no_history') : 'Could not load history.';
                container.innerHTML = `<div class="empty-state"><i class="material-icons">error_outline</i><p>${noHistoryText}</p></div>`;
            }
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('sidebarOverlay').classList.toggle('active');
        }

        async function handleLogout() {
            try {
                await fetch('/api/logout', { method: 'POST' });
                window.location.href = '/login';
            } catch (error) {
                console.error('Logout error:', error);
                window.location.href = '/login';
            }
        }

        // Load history after i18n is ready
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(loadHistory, 300);
        });
    </script>
    <script src="{{ url_for('static', filename='js/i18n.js') }}"></script>
</body>
</html>
